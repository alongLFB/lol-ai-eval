services:
  lol-ai-eval:
    build:
      context: .
      dockerfile: Dockerfile
    image: lol-ai-eval:latest
    container_name: lol-ai-eval
    restart: unless-stopped
    ports:
      - "${PORT:-3006}:${PORT:-3006}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3006}
      - HOSTNAME=0.0.0.0
    volumes:
      - lol_cache:/app/.cache
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:${PORT:-3006}/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  lol_cache:
    name: lol-ai-eval-cache
